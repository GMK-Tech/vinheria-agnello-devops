# =====================================================================
#  dnsmasq — DNS + DHCP da rede vinheria-net (172.28.0.0/24)
#  Observação: no dnsmasq, comentários só podem ficar em linha própria.
# =====================================================================

# ---------------------------- geral ----------------------------------
# Atende somente na interface da rede da vinheria
interface=eth0
bind-interfaces
# Registra cada consulta DNS e cada troca DHCP (é isso que vai para os prints)
log-queries
log-dhcp
log-facility=-

# ------------------------- DNS: encaminhamento -----------------------
# Nomes que não são da vinheria (github.com, pypi.org) são repassados ao
# resolvedor do próprio Docker, que usa o DNS da sua máquina.
no-resolv
server=127.0.0.11
domain-needed
bogus-priv

# --------------------- DNS: zona vinheria.local ----------------------
domain=vinheria.local
# Zona local: perguntas sobre *.vinheria.local nunca saem para a internet
local=/vinheria.local/
expand-hosts
# Registros A + PTR (nome -> IP e IP -> nome) de cada servidor da rede
host-record=dns-dhcp.vinheria.local,172.28.0.2
host-record=ms-pedidos.vinheria.local,172.28.0.11
host-record=ms-rastreamento.vinheria.local,172.28.0.12
host-record=jenkins.vinheria.local,172.28.0.20
# Apelido: "api" aponta para o ms-pedidos (registro CNAME)
cname=api.vinheria.local,ms-pedidos.vinheria.local

# ------------------------------ DHCP ---------------------------------
dhcp-authoritative
# Escopo de endereços entregues aos clientes (fora da faixa fixa dos servidores)
dhcp-range=172.28.0.150,172.28.0.200,255.255.255.0,12h
# Opções entregues junto com o IP: gateway, DNS e domínio
dhcp-option=option:router,172.28.0.1
dhcp-option=option:dns-server,172.28.0.2
dhcp-option=option:domain-name,vinheria.local
# Reserva: o caixa da loja sempre recebe o mesmo IP (MAC -> IP fixo)
dhcp-host=02:42:ac:1c:00:96,caixa-loja-01,172.28.0.150
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
