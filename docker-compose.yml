# =====================================================================
#  Vinheria Agnello — infraestrutura simulada em containers
#  Rede 172.28.0.0/24:
#    .2   dns-dhcp         (dnsmasq: DNS + DHCP)
#    .11  ms-pedidos
#    .12  ms-rastreamento
#    .20  jenkins
#    .150-.200  faixa DHCP (clientes)
# =====================================================================
name: vinheria

networks:
  vinheria-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
          # O Docker só distribui IPs de .0 a .127; a faixa .150-.200 fica para o DHCP
          ip_range: 172.28.0.0/25

x-dns-da-vinheria: &dns-da-vinheria
  # Todos os containers usam o dnsmasq como servidor DNS
  dns: [172.28.0.2]
  dns_search: [vinheria.local]

services:
  # ------------------------------------------------ DNS + DHCP
  dns-dhcp:
    build: ./infra/dnsmasq
    container_name: dns-dhcp
    cap_add: [NET_ADMIN]          # necessário para responder DHCP
    volumes:
      - ./infra/dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
    networks:
      vinheria-net:
        ipv4_address: 172.28.0.2
    restart: unless-stopped

  # ------------------------------------------------ certificados TLS (roda uma vez e termina)
  certs:
    image: alpine:3.20
    container_name: certs
    command: sh -c "apk add --no-cache openssl >/dev/null && sh /scripts/gerar-certs.sh"
    volumes:
      - ./infra/certs:/scripts:ro
      - ./infra/certs/out:/certs
    network_mode: none

  # ------------------------------------------------ microsserviços
  ms-rastreamento:
    build: ./services/ms-rastreamento
    container_name: ms-rastreamento
    hostname: ms-rastreamento
    <<: *dns-da-vinheria
    environment:
      TLS: ${TLS:-off}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?defina SERVICE_JWT_SECRET no .env}
    volumes:
      - ./infra/certs/out:/certs:ro
    ports: ["5002:5002"]
    networks:
      vinheria-net:
        ipv4_address: 172.28.0.12
    depends_on:
      dns-dhcp: {condition: service_started}
      certs: {condition: service_completed_successfully}

  ms-pedidos:
    build: ./services/ms-pedidos
    container_name: ms-pedidos
    hostname: ms-pedidos
    <<: *dns-da-vinheria
    environment:
      TLS: ${TLS:-off}
      USER_JWT_SECRET: ${USER_JWT_SECRET:?defina USER_JWT_SECRET no .env}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?defina SERVICE_JWT_SECRET no .env}
      SENHA_DEMO: ${SENHA_DEMO:?defina SENHA_DEMO no .env}
      RASTREAMENTO_HOST: ms-rastreamento.vinheria.local
    volumes:
      - ./infra/certs/out:/certs:ro
    ports: ["5001:5001"]
    networks:
      vinheria-net:
        ipv4_address: 172.28.0.11
    depends_on:
      ms-rastreamento: {condition: service_started}

  # ------------------------------------------------ CI/CD
  jenkins:
    build: ./infra/jenkins
    container_name: jenkins
    hostname: jenkins
    <<: *dns-da-vinheria
    ports: ["8080:8080"]
    volumes:
      - jenkins_home:/var/jenkins_home
      # "Pasta de produção": é aqui que o pipeline publica (simula o IIS/wwwroot)
      - ./publicacao:/publicacao
    networks:
      vinheria-net:
        ipv4_address: 172.28.0.20
    depends_on:
      dns-dhcp: {condition: service_started}

  # ------------------------------------------------ demonstrações (perfis opcionais)
  # Cliente que pede um IP ao DHCP:  docker compose --profile dhcp run --rm cliente-dhcp
  cliente-dhcp:
    image: busybox:1.36
    profiles: [dhcp]
    mac_address: "02:42:ac:1c:00:96"   # MAC reservado no dnsmasq -> recebe sempre .150
    cap_add: [NET_ADMIN]
    command: udhcpc -i eth0 -f -q -n -s /bin/true -x hostname:caixa-loja-01
    networks: [vinheria-net]
    depends_on: [dns-dhcp]

  # Cliente que usa a API (login + pedidos):  docker compose --profile demo run --rm cliente
  cliente:
    build: ./demo
    profiles: [demo]
    <<: *dns-da-vinheria
    environment:
      TLS: ${TLS:-off}
      SENHA_DEMO: ${SENHA_DEMO}
    volumes:
      - ./infra/certs/out:/certs:ro
    networks: [vinheria-net]
    depends_on: [ms-pedidos]

  # Captura de tráfego para abrir no Wireshark:  docker compose --profile captura up -d sniffer
  sniffer:
    image: nicolaka/netshoot:latest
    profiles: [captura]
    container_name: sniffer
    network_mode: "service:ms-pedidos"   # enxerga tudo que entra e sai do ms-pedidos
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./capturas:/capturas
    command: ["tcpdump", "-i", "eth0", "-U", "-w", "/capturas/trafego-tls-${TLS:-off}.pcap",
              "tcp port 5001 or tcp port 5002"]

volumes:
  jenkins_home:
